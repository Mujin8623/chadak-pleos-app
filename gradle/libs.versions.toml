[versions]
agp = "8.8.2"
kotlin = "2.0.0"
compileSdk = "35"
minSdk = "28"
targetSdk = "35"
coreKtx = "1.15.0"
appcompat = "1.7.0"
material = "1.12.0"
activity = "1.9.3"
junit = "4.13.2"
pleosVehicle = "2.3.2"
pleosNaviHelper = "3.0.5"
pleosTextToSpeech = "3.3.1"
pleosSpeechToText = "3.3.1"
pleosFusedLocation = "1.1.3"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
pleos-vehicle = { group = "ai.pleos.playground", name = "Vehicle", version.ref = "pleosVehicle" }
pleos-navi-helper = { group = "ai.pleos.playground", name = "NaviHelper", version.ref = "pleosNaviHelper" }
