org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Submission APK: <teamName>_<apkAppName>_release.apk
# The challenge rule is 팀명_앱이름_release.apk. The default file token is ASCII
# "Chadak" because Korean filenames are risky in CI. Use -PapkAppName=차닥 for the literal name.
teamName=TEAM
apkAppName=Chadak
