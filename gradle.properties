org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# Submission APK: <teamName>_<apkAppName>_release.apk
# Contest rule: apk/<team>_<app>_release.apk -> 차량분석가_차닥_release.apk
# gradle.properties is read as ISO-8859-1, so Korean values are \u-escaped here:
#   teamName   = 차량분석가
#   apkAppName = 차닥
teamName=\uCC28\uB7C9\uBD84\uC11D\uAC00
apkAppName=\uCC28\uB2E5
